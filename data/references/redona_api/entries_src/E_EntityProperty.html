<textarea id="enum_info" style="display: none;">
<?xml version="1.0" encoding="UTF-8"?>
<root title="E_EntityProperty" desc="Provides some necessary properties for every entity in application.">
	<entry name="ACTIVE" v="1.0">
		Determines when an entity should be processed within driver or not.
	</entry>
	<entry name="VISIBLE" v="1.0">
		Determines entity visibility. Hidden objects won't be rendered.
	</entry>
	<entry name="EXTENDED_LIFETIME" v="1.0">
		Determines entity lifetime - if it is extended, then it will be keep between arenas.
	</entry>
	<entry name="SLEEP" v="1.0">
		Usable with EXTENDED_LIFETIME; when entity sleep then all data is serialized into temporary buffer and is not actively maintained on main heap.
		Also ACTIVE and VISIBLE properties are ignored and entity behaves as set them as false.
	</entry>
</root>
</textarea>
