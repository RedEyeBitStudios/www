<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="https://storage.googleapis.com/red_eye_bit_studios-public/www/redeyebit-icon.svg" type="image/x-icon">
	<script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="preconnect" href="locales/pl-PL/locale.xml" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Spline+Sans:wght@300..700&display=swap" rel="stylesheet">
	<link href="https://iosevka-webfonts.github.io/iosevka-fixed/iosevka-fixed.css" rel="stylesheet" />
	<link href="https://iosevka-webfonts.github.io/iosevka-fixed/iosevka-fixed.css" rel="preconnect" />
	<link rel="stylesheet" href="home.css">
	<script src="../content.js"></script>
	<script>
		async function load(path)
		{
			const response = await fetch(path);
		
			if (response.status == 200 && response.ok)
			{
				response.text().then(
							function(x)
							{
								$("#content").html(x);
							}
						);
			}
			return response.status;
		}
		async function loadVersionSummary(version)
		{
			function makeArray(xml_section)
			{
				let array = [];
				const children = $(xml_section).find("def");
				$(children).each(
					function(index, element)
					{
						array.push($(this).text().toString());
					}
				)
				return array;
			}
			function addSection(xml_doc, section_name)
			{
				const root = xml_doc.firstElementChild;

				const provided_array = makeArray($(root).find(section_name)).sort();

				$(provided_array).each(
					function(index)
					{
						let div = $("<div>", { class: "symbol_link"});
						div.text(this);

						$("#" + section_name).append(div);
					}
				);
			}

			await load("templates/version_summary.html");
			const response = await fetch("summaries/" + version + ".xml");
			if (response.ok)
			{
				const xml_fetched = (await response.text()).toString();

				const xml_doc = $.parseXML(xml_fetched);
				addSection(xml_doc, "provided");

				$(".symbol_link").on("click",
					async function()
					{
						await load("entries_src/" + $(this).text() + ".html");
					}
				);
			}
		}
	</script>
	<title>Red Eye Bit Studios</title>
</head>
<body>
	<div class="side_bar" id="side_bar">
		<img src="https://storage.googleapis.com/red_eye_bit_studios-public/www/redona-engine-icon-512x512.png" alt="" class="side_bar-img" id="small_image">
		<img src="https://storage.googleapis.com/red_eye_bit_studios-public/www/redona_api_reference_logo-512x128.png" alt="" class="side_bar-img" id="big_image">
		<div id="list">
			<div class="line"></div>
			<div class="side_bar-entry">
				Introduction
			</div>
			<div class="side_bar-entry-custom" onclick="loadVersionSummary('1.0')">
				Summary of v1.0
			</div>
			<div class="line"></div>
			<div id="entries"></div>
		</div>
	</div>
	<div id="content">
		
	</div>
	<script>
		const response = fetch("entries.xml");
		response.then(
			async function(resp)
			{
				const xml_fetched = await resp.text();
				const xml_doc = $.parseXML(xml_fetched);
				const root = xml_doc.firstElementChild;

				const children_nodes = root.children;

				let entries = [];
				$(children_nodes).each(
					function()
					{
						entries.push($(this).text());
						
					}
				);
				entries.sort();
				$(entries).each(
					function()
					{
						let div = $("<div>", { class: "side_bar-entry"});
						div.text(this);
						$("#entries").append(div);
					}
				);

				$(".side_bar-entry").on("click",
					async function()
					{
						await load("entries_src/" + $(this).text() + ".html");
					}
				);
			}
		);		
		//load("entries_src/Introduction.html");
		load("entries_src/E_EntityProperty.html");
		
	</script>
</body>
</html>
